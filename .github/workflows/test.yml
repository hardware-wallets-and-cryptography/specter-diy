name: CI

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r test/integration/requirements.txt
      - name: Run native unit tests
        working-directory: test
        run: |
          python3 run_native_tests.py
          python3 -m compileall ../src ../test

  tests:
    # pinned: old MicroPython unix port segfaults on newer gcc/glibc (see MPY_UNIX_CFLAGS in Makefile)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            libsdl2-dev \
            pkg-config \
            python3
      - name: Run tests
        run: make test
      - name: Backtrace on crash
        if: failure()
        run: |
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex bt --args bin/micropython_unix -c 'import asyncio' || true
